name: Vita build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK and packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake make git curl xz-utils bzip2 >/dev/null
          git clone --depth 1 https://github.com/vitasdk/vdpm "$RUNNER_TEMP/vdpm"
          cd "$RUNNER_TEMP/vdpm"
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          # the SDK's own vdpm (bin/vdpm with libexec/vdpm/pacman), not the script in the clone
          "$VITASDK/bin/vdpm" install zlib libpng libjpeg-turbo freetype libvita2d mpg123

      - name: Build
        run: |
          export PATH="$VITASDK/bin:$PATH"
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: ahhd-vita-vpk
          path: build/*.vpk

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the desktop harness
        run: |
          gcc -O2 -Wall -Ithird_party/libtess2/Include -o hosttest tools/hosttest.c \
            src/ah_view.c src/swf.c src/render.c src/as_core.c src/as_mc.c src/as_lib.c src/as_render.c \
            src/cc_host.c src/cc_native.c src/hostfont.c src/strtab.c src/cc_buttons.c \
            src/level.c src/player.c src/enemy.c third_party/libtess2/Source/*.c -lm -lz
